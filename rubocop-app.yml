inherit_from: rubocop-base.yml

plugins:
  - rubocop-rails

AllCops:
  Exclude:
    - "**/bin/**/*"
    - "**/db/**/*"
    - "**/log/**/*"
    - "**/tmp/**/*"
    - "**/vendor/**/*"

Canon/DeclarationGroups:
  inherit_mode:
    merge:
      - GroupedMethods
  GroupedMethods:
    - [belongs_to, has_and_belongs_to_many, has_many, has_one]
    - [validate, validates]
    - [
        after_commit,
        after_create,
        after_create_commit,
        after_destroy,
        after_save,
        after_update,
        after_update_commit,
        before_create,
        before_save,
        before_validation,
      ]

Canon/MethodBodyBlankLines:
  inherit_mode:
    merge:
      - SeparatedMethods
  SeparatedMethods:
    - head
    - mail
    - redirect_to
    - render

Rails/Delegate:
  Enabled: false

Rails/HttpPositionalArguments:
  Enabled: false
