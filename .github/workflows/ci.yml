name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: ruby -ryaml -e "Dir['rubocop-*.yml'].each { |file| YAML.safe_load_file(file) }; puts 'Valid'"
  smoke:
    name: Smoke test (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - rubocop-gem.yml
          - rubocop-app.yml
          - rubocop-app.yml rubocop-apiwork.yml
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: |
          mkdir -p tmp/smoke
          echo '# frozen_string_literal: true' > tmp/smoke/test.rb
          echo "inherit_from:" > tmp/smoke/.rubocop.yml
          for file in ${{ matrix.preset }}; do echo "  - ../../$file" >> tmp/smoke/.rubocop.yml; done
          cd tmp/smoke && bundle exec rubocop --config .rubocop.yml test.rb
  all-green:
    name: All checks passing
    if: always()
    needs: [validate, smoke]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [[ "${{ needs.validate.result }}" == "success" ]] || exit 1
          [[ "${{ needs.smoke.result }}" == "success" ]] || exit 1
